[project]
name = "bsky-mcp"
version = "0.1.0"
description = "Personal Bluesky MCP server for Claude: read, draft, and engage. Cannot publish or block."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1,<5",
    "atproto>=0.0.73",
    "py-key-value-aio[redis]>=0.4.6",
    "pydantic-settings>=2.6",
    "regex>=2024.11.6",
    # Listed directly (it also comes with FastMCP) so Vercel detects a Starlette app.
    "starlette>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsky_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
