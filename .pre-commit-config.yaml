# The same configuration runs locally (pre-commit install) and in CI on every pull request.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.93
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: cpd
        name: PMD CPD (duplicated blocks of 50+ tokens)
        entry: scripts/cpd.sh
        language: system
        pass_filenames: false
        types: [python]
